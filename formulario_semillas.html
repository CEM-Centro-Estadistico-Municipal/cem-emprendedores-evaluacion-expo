<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Cómo te fue con las semillas?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#1fa3ec;--brand-strong:#0f8bd6;--brand-tint:#ecf8ff;--brand-soft:#d4eefe;--text-strong:#111418;--text-body:#1f2730;--text-muted:#54616e;--surface-page:#f6f9fb;--surface-card:#fff;--border:#e1e7ec;--ink-300:#c4ccd4;--focus-ring:#40b2f4;--red-500:#e0413c;
--seed:#2faa5a;--seed-strong:#1f8a4a;--seed-soft:#e3f5ea;
--font-body:"Open Sans",system-ui,sans-serif;--font-display:"Novecento","Open Sans",system-ui,sans-serif;
--shadow-brand:0 8px 22px rgba(31,163,236,.28);--shadow-soft:0 6px 18px rgba(20,63,94,.10);--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-body);background:var(--surface-page);color:var(--text-body);font-size:17px;line-height:1.45}
header{background:var(--brand);color:#fff;padding:22px 20px 56px}
.wrap{max-width:640px;margin:0 auto}
.logo{display:block;width:170px;height:auto;margin-bottom:26px}
h1{margin:0 0 12px;font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:clamp(36px,10vw,54px);line-height:1.02;letter-spacing:.01em}
.hl{display:inline-block;background:var(--seed-strong);color:#fff;padding:.02em .22em .0em;border-radius:10px}
header p{margin:0;font-size:17px;max-width:30em}
main{max-width:640px;margin:-34px auto 40px;padding:0 14px}
.panel{background:var(--surface-card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-soft);padding:6px 20px 24px}
.intro{display:flex;gap:14px;align-items:center;padding:18px 0 16px;border-bottom:1px solid var(--border)}
.disc{flex:none;width:46px;height:46px;border-radius:50%;background:var(--seed);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 6px var(--seed-soft)}
.disc svg{width:24px;height:24px}
.intro b{display:block;color:var(--text-strong);font-weight:800}
.intro span{color:var(--text-muted);font-size:15px}
.q{padding:18px 0;border-bottom:1px solid var(--border)}
.q:last-of-type{border-bottom:0}
.q>label,.q>.t{display:block;font-weight:800;color:var(--text-strong);margin-bottom:4px}
.hint{color:var(--text-muted);font-size:14.5px;margin:0 0 10px}
.req{color:var(--seed-strong)}
input[type=text],input[type=tel],textarea{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--ink-300);border-radius:12px;background:#fff;color:var(--text-body)}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus{outline:3px solid var(--brand-soft);border-color:var(--brand)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pill{position:relative;display:block}
.pill input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.pill span{display:block;padding:10px 16px;border:1.5px solid var(--ink-300);border-radius:999px;background:#fff;font-weight:600;font-size:16px;transition:background .14s var(--ease),border-color .14s var(--ease)}
.pill:hover span{border-color:var(--seed)}
.pill:has(input:checked) span{background:var(--seed-strong);border-color:var(--seed-strong);color:#fff}
.pill:has(input:focus-visible) span{outline:3px solid var(--focus-ring);outline-offset:2px}
.otro{display:none;margin-top:10px}
.otro.on{display:block}
.err{display:none;color:var(--red-500);font-weight:700;font-size:15px;margin-top:8px}
.q.bad .err{display:block}
.q.bad{background:#fdf1f0;margin:0 -12px;padding-left:12px;padding-right:12px;border-radius:12px}
button{width:100%;margin-top:18px;padding:16px;font:inherit;font-weight:800;font-size:18px;background:var(--brand);color:#fff;border:0;border-radius:999px;cursor:pointer;box-shadow:var(--shadow-brand);transition:filter .14s var(--ease),transform .14s var(--ease)}
button:hover{filter:brightness(.94)}
button:active{transform:scale(.97)}
button:disabled{opacity:.6;cursor:wait}
.gracias{display:none;text-align:center;padding:36px 22px;background:var(--surface-card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-soft)}
.gracias .disc{margin:0 auto 16px;width:64px;height:64px}
.gracias .disc svg{width:32px;height:32px}
.gracias h2{margin:0 0 8px;font-family:var(--font-display);text-transform:uppercase;font-size:30px;color:var(--text-strong)}
.gracias p{margin:0;color:var(--text-muted)}
.foto-btn{display:inline-flex;align-items:center;gap:8px;margin-top:8px;padding:12px 20px;border:2px dashed var(--seed);border-radius:999px;color:var(--seed-strong);font-weight:700;cursor:pointer;background:var(--seed-soft)}
.thumbs{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
.th{width:140px}
.th img{display:block;width:140px;height:140px;object-fit:cover;border-radius:12px;border:1px solid var(--border)}
.th button{width:100%;margin-top:6px;padding:8px;font-size:14px;font-weight:700;background:#fff;color:var(--text-muted);border:1.5px solid var(--ink-300);box-shadow:none}
.hide{display:none}
</style>
</head>

 {id:"repetir",t:"¿Te gustaría volver a recibir semillas?",type:"radio",opts:["Sí","Tal vez","No"],req:1},
 {id:"otras",t:"¿Qué otras semillas te gustaría recibir?",type:"text"},
 {id:"fotos",t:"Si querés, mostranos cómo te fue",type:"foto",hint:"Podés subir hasta 2 fotos de la huerta o de las plantas."},
 {id:"comentario",t:"¿Querés contarnos algo más?",type:"textarea"}
];

let fotos = [];
const form = document.getElementById("f");
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");

form.innerHTML = Q.map(q => {
  let body = "";
  if (q.type==="text"||q.type==="tel") body = `<input type="${q.type}" name="${q.id}" id="${q.id}" autocomplete="off">`;
  else if (q.type==="foto") body = `<label class="foto-btn" id="fotoBtn"><input type="file" id="fotoInput" accept="image/*" multiple hidden>+ Agregar foto</label><div class="thumbs" id="thumbs"></div>`;
  else if (q.type==="textarea") body = `<textarea name="${q.id}" id="${q.id}"></textarea>`;
  else {
    const kind = q.type==="check" ? "checkbox" : "radio";
    const all = q.otro ? q.opts.concat(["Otra"]) : q.opts;
    body = `<div class="opts">` + all.map(o =>
      `<label class="pill"><input type="${kind}" name="${q.id}" value="${esc(o)}"><span>${o}</span></label>`).join("") + `</div>`;
    if (q.otro) body += `<input type="text" class="otro" id="${q.id}_otro" placeholder="Escribí cuál">`;
  }
  const head = (q.type==="text"||q.type==="tel"||q.type==="textarea")
    ? `<label for="${q.id}">${q.t}${q.req?' <span class="req">*</span>':''}</label>`
    : `<span class="t">${q.t}${q.req?' <span class="req">*</span>':''}</span>`;
  return `<div class="q${q.only?' hide':''}" id="q_${q.id}">${head}${q.hint?`<p class="hint">${q.hint}</p>`:""}${body}<div class="err">Falta completar esta pregunta.</div></div>`;
}).join("") + `<button type="submit" id="btn">Enviar mi devolución</button>`;

function val(q){
  if (q.type==="foto") return fotos.length?String(fotos.length):"";
  if (q.type==="radio"||q.type==="check"){
    const sel=[...form.querySelectorAll(`input[name="${q.id}"]:checked`)].map(i=>i.value);
    const otro=form.querySelector(`#${q.id}_otro`);
    return sel.map(v => v==="Otra" ? "Otra: "+((otro&&otro.value.trim())||"sin especificar") : v).join(", ");
  }
  return form.querySelector("#"+q.id).value.trim();
}
function refresh(){
  const sembro = val(Q.find(q=>q.id==="sembro"));
  Q.forEach(q=>{
    if (q.type==="radio"||q.type==="check"){
      const o=form.querySelector(`#${q.id}_otro`);
      if(o) o.classList.toggle("on", !!form.querySelector(`input[name="${q.id}"][value="Otra"]:checked`));
    }
    if(!q.only) return;
    const show = q.only==="malas" ? val(Q.find(x=>x.id==="calidad"))==="Malas" : (sembro && ((q.only==="no") === (sembro===NO)));
    document.getElementById("q_"+q.id).classList.toggle("hide", !show);
  });
}
const MAXF = 2;
function comprimir(file){
  return new Promise((res,rej)=>{
    const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{
      const k=Math.min(1,1280/Math.max(img.width,img.height));
      const c=document.createElement("canvas");
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg",.72));
    };
    img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("No se pudo leer la foto. Probá con otra."));};
    img.src=u;
  });
}
function pintarFotos(){
  document.getElementById("thumbs").innerHTML=fotos.map((f,i)=>`<div class="th"><img src="${f.url}" alt="Foto ${i+1}"><button type="button" data-i="${i}">Quitar</button></div>`).join("");
  document.getElementById("fotoBtn").style.display=fotos.length>=MAXF?"none":"";
}
document.getElementById("fotoInput").addEventListener("change",async e=>{
  const files=[...e.target.files]; e.target.value="";
  for(const f of files){
    if(fotos.length>=MAXF) break;
    try{ fotos.push({url:await comprimir(f),name:f.name}); }catch(err){ alert(err.message); }
  }
  pintarFotos();
});
document.getElementById("thumbs").addEventListener("click",e=>{
  const b=e.target.closest("button[data-i]");
  if(b){ fotos.splice(+b.dataset.i,1); pintarFotos(); }
});
form.addEventListener("change", refresh);

form.addEventListener("submit", async e=>{
  e.preventDefault();
  let first=null;
  const data={};
  Q.forEach(q=>{
    const box=document.getElementById("q_"+q.id);
    const hidden=box.classList.contains("hide");
    data[q.id]=hidden?"":val(q);
    const bad = !hidden && q.req && !data[q.id];
    box.classList.toggle("bad",bad);
    if(bad && !first) first=box;
  });
  if(first){first.scrollIntoView({behavior:"smooth",block:"center"});return;}
  data.fotosData=fotos.map(f=>({nombre:f.name,data:f.url.split(",")[1]}));
  const btn=document.getElementById("btn");
  btn.disabled=true; btn.textContent="Enviando…";
  try{
    if(SCRIPT_URL.includes("PEGAR")) throw new Error("Falta pegar la URL de Apps Script en SCRIPT_URL");
    const r = await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(data)});
    const j = await r.json();
    if(!j.ok) throw new Error(j.error||"El script no pudo guardar");
    document.querySelector(".panel").style.display="none";
    document.getElementById("ok").style.display="block";
    window.scrollTo({top:0,behavior:"smooth"});
  }catch(err){
    btn.disabled=false; btn.textContent="Enviar mi devolución";
    console.error(err);
    alert("No se pudo guardar tu devolución. Revisá tu conexión e intentá de nuevo.\n\nDetalle técnico: "+err.message);
  }
});
</script>
</body>
</html>
